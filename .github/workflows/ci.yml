name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Generated files up to date
        run: |
          python tools/gen_spec.py --check
          python tools/gen_cordic.py --check
      - run: ruff check sw tools hw/tb hw/scripts
      - run: pytest -q
      - name: Device tests through UdpTransport and a local UDP socket
        run: pytest -q sw/tests/test_device.py --port udpsim

  rtl-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Verilator (OSS CAD Suite; cocotb 2.x needs Verilator >= 5.036)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Release lookup otherwise uses the runner's shared anonymous API limit.
          github-token: ${{ github.token }}
      - run: pip install -e ".[dev]"
      - name: cocotb golden-vector test (Verilator)
        run: python hw/tb/cocotb/run.py --sim verilator
      - name: pyuvm FPU block regression, all 18 ops (Verilator)
        run: python hw/tb/pyuvm/run.py fpu --test FpuRegressTest --n 3000
      # I keep the shared pipeline's seed edges and correction boundaries in CI,
      # rather than depending on the general mixed run to happen to hit them.
      - name: Shared pipeline divide hard cases and randoms (Verilator)
        run: python hw/tb/pyuvm/run.py fpu --test FpuDivTest --n 30000
      - name: Shared pipeline square-root hard cases and randoms (Verilator)
        run: python hw/tb/pyuvm/run.py fpu --test FpuSqrtTest --n 30000
      - name: pyuvm FPU block with a 16-entry CORDIC FIFO, so every stall rule fires (Verilator)
        run: python hw/tb/pyuvm/run.py fpu16 --test FpuRegressTest --n 3000
      - name: pyuvm top-level regression (Verilator)
        run: python hw/tb/pyuvm/run.py top --test TopRegressTest
      - name: pyuvm Ethernet regression (Verilator)
        run: python hw/tb/pyuvm/run.py eth --test EthRegressTest
      - name: pyuvm Ethernet multi-frame and back-to-back (Icarus, 4-state)
        run: python hw/tb/pyuvm/run.py eth --sim icarus --test EthMultiTest
      - name: pyuvm FPU corner matrix (Icarus, 4-state)
        run: python hw/tb/pyuvm/run.py fpu --sim icarus --test FpuCornerTest
      # I repeat these in four-state simulation so X/Z mistakes can't hide.
      - name: Shared pipeline divide hard cases (Icarus, 4-state)
        run: python hw/tb/pyuvm/run.py fpu --sim icarus --test FpuDivTest --n 2000
      - name: Shared pipeline square-root hard cases (Icarus, 4-state)
        run: python hw/tb/pyuvm/run.py fpu --sim icarus --test FpuSqrtTest --n 2000
      # I check the sum and scheduler separately, then exercise both through the core above.
      # I keep Icarus runs too, since a 2-state simulator cannot expose X/Z mistakes.
      - name: pyuvm exact accumulator regression (Verilator)
        run: python hw/tb/pyuvm/run.py accum --test AccumRegressTest --n 1000
      - name: pyuvm exact accumulator regression (Icarus, 4-state)
        run: python hw/tb/pyuvm/run.py accum --sim icarus --test AccumRegressTest --n 100
      - name: pyuvm expression unit regression (Verilator)
        run: python hw/tb/pyuvm/run.py evu --test EvuRegressTest --n 120
      - name: pyuvm expression unit point limits (Verilator)
        run: python hw/tb/pyuvm/run.py evu --test EvuLimitTest --n 200
      - name: pyuvm expression unit, 16-entry CORDIC FIFO (Verilator)
        run: python hw/tb/pyuvm/run.py evu16 --test EvuRegressTest --n 60
      - name: pyuvm expression unit regression (Icarus, 4-state)
        run: python hw/tb/pyuvm/run.py evu --sim icarus --test EvuRegressTest --n 15
      - name: pyuvm CORDIC block regression, all six phase 3 ops (Verilator)
        run: python hw/tb/pyuvm/run.py cordic --test CordicRegressTest --n 5000
      - name: pyuvm CORDIC block, all six phase 3 ops (Icarus, 4-state)
        run: python hw/tb/pyuvm/run.py cordic --sim icarus --test CordicRegressTest --n 500
