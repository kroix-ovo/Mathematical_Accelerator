# Single source of truth for the host <-> FPGA contract.
# Run `python tools/gen_spec.py` after editing; it regenerates
#   hw/rtl/pkg/accel_pkg.sv  and  sw/mathaccel/_generated/spec.py
# See docs/protocol.md for the wire format.

[device]
magic = 0x4D414343          # "MACC"
version_major = 0
version_minor = 4          # 0.3: FPU op codes 12-17 (phase 3 CORDIC ops). 0.4: EVU kernel
clk_hz = 100_000_000
baud = 2_000_000            # exact divider at 100 MHz (50 clocks/bit)
scratch_addr_bits = 16      # 64 Ki words x 32 bit = 256 KiB scratchpad
max_payload = 1024          # bytes, request or response payload
# Number of FPU op codes the FPU kernel accepts (0 .. fpu_op_count-1); larger
# codes get BAD_ARG. 12 in protocol 0.2, 18 since the phase 3 CORDIC ops.
fpu_op_count = 18

# Request opcodes. Responses echo the opcode with bit 7 set.
[opcodes]
PING      = 0x01
WRITE_MEM = 0x02
READ_MEM  = 0x03
RUN       = 0x04
STATUS    = 0x05

# First payload byte of every response.
[status]
OK         = 0x00
BAD_OP     = 0x01
BAD_LEN    = 0x02
BAD_ADDR   = 0x03
BUSY       = 0x04
BAD_KERNEL = 0x05
BAD_ARG    = 0x06       # kernel argument out of range (e.g. FPU op code >= fpu_op_count)

# Kernel ids for RUN.
[kernels]
NOP  = 0x00     # args: none; measures dispatch overhead
FILL = 0x01     # args: base u32, count u32, value u32
FPU  = 0x02     # args: fop u8, count u32, a u32, b u32, r u32, f u32 (see docs/protocol.md)
EVU  = 0x03     # args: desc u32, the scratchpad address of a 16-word descriptor (see docs/protocol.md)

# FPU operation codes (5 bits). Used by the FPU kernel and the fpu block.
# Unary operations (SQRT, I2F, F2I, SIN, COS, EXP, LN) ignore operand b.
# Codes 12-17 are the phase 3 transcendental functions. Their results are
# not bit exact: they are within an error budget measured in ULPs (see
# docs/numerics.md). Angles are in radians.
[fpu_ops]
ADD  = 0x0
SUB  = 0x1
MUL  = 0x2
DIV  = 0x3
SQRT = 0x4
I2F  = 0x5      # signed int32 -> fp32
F2I  = 0x6      # fp32 -> signed int32, round to nearest even, saturating
MIN  = 0x7
MAX  = 0x8
EQ   = 0x9      # compare results are the integers 0 or 1
LT   = 0xA
LE   = 0xB
SIN   = 0xC
COS   = 0xD
ATAN2 = 0xE     # atan2(a, b): angle of the point (x = b, y = a), like C's atan2(y, x)
HYPOT = 0xF     # sqrt(a^2 + b^2) without intermediate overflow
EXP   = 0x10    # e^a
LN    = 0x11    # natural log of a

# IEEE-754 exception flags (5-bit mask, same bit order as RISC-V fflags).
[fpu_flags]
NX = 0x01       # inexact
UF = 0x02       # underflow (tiny after rounding and inexact)
OF = 0x04       # overflow
DZ = 0x08       # divide by zero
NV = 0x10       # invalid operation

# I keep the Phase 4 expression-unit limits here so my compiler and RTL agree.
# I pack each instruction into a 32-bit word (docs/phase4-plan.md):
#   [31:27] op    an FPU op code (0-17), or op_load
#   [26]    last  the final instruction; its result is the point's output
#   [25:20] dst   destination register
#   [19:13] a     first source. Bit 6 set means constant, clear means register.
#                 For op_load this field is the table number instead.
#   [12:6]  b     second source, coded the same way
#   [5:0]   zero
[evu]
contexts = 31       # points in flight at once; bank 31 of the register file holds the constants
registers = 64      # registers per context
constants = 64      # constants shared by all contexts
program_len = 256   # instructions in a program
tables = 6          # node tables a program can read
dims = 3            # grid dimensions
max_points_log2 = 32   # a run may have at most 2^32 points; beyond that the sum could outgrow the accumulator's checks
op_load = 0x1F      # R[dst] = table[a][index of that table's dimension]
op_shift = 27
last_shift = 26
dst_shift = 20
a_shift = 13
b_shift = 6
src_const = 0x40    # set in a source field: the low 6 bits name a constant
# A run is described by 16 words in the scratchpad, at the address RUN gives.
# Values here are word offsets into that descriptor, except desc_dim_shift.
desc_words = 16
desc_mode = 0       # bit 0 set: reduce (one sum). Clear: map (one result per point).
desc_prog = 1       # scratchpad address of the instruction words
desc_prog_len = 2   # how many instruction words
desc_const = 3      # scratchpad address of the constants
desc_const_len = 4  # how many constants
desc_grid = 5       # n0, n1, n2: three words. An unused dimension holds 1.
desc_r = 8          # where the results go
desc_f = 9          # where the flags go
desc_table = 10     # six words, one per node table: base address, and its dimension above
desc_dim_shift = 16

# UDP transport over the onboard LAN8720A (RMII, 100 Mbit/s, direct cable).
# The board answers ARP and ICMP echo for `ip` and accepts command frames as
# UDP datagrams sent to `udp_port`. `host_ip` is the laptop's static address;
# the hardware never uses it (replies go to whoever sent the request), it is
# here so the docs and the Python default agree with one place.
[ethernet]
mac = "02:4D:41:43:43:01"   # locally administered (bit 1 of the first byte); 4D 41 43 43 = "MACC"
ip = "192.168.10.2"
host_ip = "192.168.10.1"
udp_port = 50000
